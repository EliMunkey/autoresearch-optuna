[project]
name = "autoresearch-optuna"
version = "0.1.0"
description = "Autonomous optimization of Optuna's TPE sampler"
requires-python = ">=3.10"
dependencies = [
    "optuna>=3.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
